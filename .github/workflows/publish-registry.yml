name: Publish MCP Registry
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check production discovery
        run: |
          curl --fail --silent --show-error https://secure.openleash.com/health/ready
          curl --fail --silent --show-error https://secure.openleash.com/.well-known/oauth-authorization-server | python3 -c 'import json,sys; m=json.load(sys.stdin); assert m["issuer"]=="https://secure.openleash.com" and "S256" in m["code_challenge_methods_supported"]'
      - name: Download verified official publisher
        run: |
          curl --fail --location --silent --show-error https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz -o publisher.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  publisher.tar.gz' | sha256sum --check
          tar -xzf publisher.tar.gz mcp-publisher
      - name: Publish with repository identity
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
